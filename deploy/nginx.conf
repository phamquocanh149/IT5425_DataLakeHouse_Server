# Install on the host; API Compose binding remains 127.0.0.1:8000.
# Replace climate.example.org and certificate paths before nginx -t/reload.
limit_req_zone $binary_remote_addr zone=climate_edge:10m rate=10r/s;
server {
    listen 80;
    server_name climate.example.org;
    return 400; # API callers must configure HTTPS, never rely on a redirect.
}
server {
    listen 443 ssl;
    server_name climate.example.org;
    ssl_certificate /etc/letsencrypt/live/climate.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/climate.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 21m;
    client_body_timeout 15s;
    limit_req zone=climate_edge burst=20 nodelay;
    limit_req_status 429;
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }
}
