name: Server checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: climate-platform
      - uses: actions/checkout@v4
        with:
          repository: phamquocanh149/IT5425_DataLakeHouse_Client
          path: climate-collector
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: climate-platform/requirements*.txt
      - name: Install
        working-directory: climate-platform
        run: python -m pip install -r requirements-dev.txt
      - name: Lint and tests
        working-directory: climate-platform
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest -q
      - name: Docker build
        working-directory: climate-platform
        run: docker build -t climate-server:ci .
      - name: Compose and native Client smoke
        working-directory: climate-platform
        run: python scripts/compose_smoke.py | tee minio-smoke.log
      - name: Upload MinIO validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minio-integration
          path: climate-platform/minio-smoke.log
