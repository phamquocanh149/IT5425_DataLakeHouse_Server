target-version = "py311"
line-length = 100
extend-exclude = [".pytest_tmp", "data", "data_lake", "metadata", "warehouse", "vendor"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"tests/integration/test_loopback.py" = ["E402"]
# Imported pytest fixtures are injected by parameter name, not called directly.
"tests/test_stage15.py" = ["F811"]

"tests/test_readiness_security.py" = ["F811"]

"tests/test_stage2_registry.py" = ["F811"]
"tests/test_medallion_backup.py" = ["F811"]
