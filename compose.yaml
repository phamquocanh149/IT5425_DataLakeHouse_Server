x-medallion-environment: &medallion-environment
  SERVICE_MODE: worker
  BASE_DIR: /storage
  METADATA_DIR: metadata
  SCRATCH_DIR: /worker-cache
  STORAGE_BACKEND: s3
  S3_ENDPOINT: http://minio:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-climate-bronze}
  S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-climate-silver}
  S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-climate-gold}
  S3_ACCESS_KEY: ${MEDALLION_S3_ACCESS_KEY:-climate-worker}
  S3_SECRET_KEY: ${MEDALLION_S3_SECRET_KEY:-${MINIO_ROOT_PASSWORD}}
  MEDALLION_S3_ACCESS_KEY: ${MEDALLION_S3_ACCESS_KEY:-climate-worker}
  MEDALLION_S3_SECRET_KEY: ${MEDALLION_S3_SECRET_KEY:?Set MEDALLION_S3_SECRET_KEY}
  MEDALLION_PUBLISH_CACHE_ROOT: /worker-cache
  USDM_GIS_PYTHON: /usr/local/bin/python
  DAGSTER_HOME: /dagster-home
  HOME: /dagster-home

services:
  api:
    build: .
    image: ${CLIMATE_API_IMAGE:-climate-platform-api:latest}
    pull_policy: ${API_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      COLLECTOR_API_KEY: ${COLLECTOR_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      COLLECTOR_SOURCES: '${COLLECTOR_SOURCES:-["usdm","noaa","usgs","nldas"]}'
      ENABLE_STATIC_KEYS: ${ENABLE_STATIC_KEYS:-true}
      API_KEYS: '${API_KEYS:-[]}'
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-120}
      DAILY_UPLOAD_QUOTA_BYTES: ${DAILY_UPLOAD_QUOTA_BYTES:-1073741824}
      REQUIRE_SSE_KMS: ${REQUIRE_SSE_KMS:-false}
      REQUIRE_OBJECT_LOCK: ${REQUIRE_OBJECT_LOCK:-false}
      SQLITE_BUSY_TIMEOUT_SECONDS: ${SQLITE_BUSY_TIMEOUT_SECONDS:-0.5}
      DEBUG: "False"
      BASE_DIR: /storage
      DATA_LAKE_DIR: data_lake
      METADATA_DIR: metadata
      TEMP_DIR: data_lake/temp
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-climate-bronze}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-20971520}
      CHUNK_SIZE_BYTES: ${CHUNK_SIZE_BYTES:-1048576}
    volumes:
      - bronze:/storage/data_lake
      - registry:/storage/metadata
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3
    cpus: 1.0
    mem_limit: 512m
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  minio:
    image: ${MINIO_IMAGE:-noname12346767/my-minio}
    pull_policy: ${MINIO_PULL_POLICY:-missing}
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /minio/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; read -r line <&3; [[ $$line == *' 200 '* ]]"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true
  minio-init:
    image: ${MINIO_MC_IMAGE:-noname12346767/mc-allos}
    pull_policy: ${MINIO_PULL_POLICY:-missing}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init/minio-init.sh"]
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-climate-bronze}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-climate-silver}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-climate-gold}
      S3_BUCKET_WAREHOUSE: ${S3_BUCKET_WAREHOUSE:-climate-warehouse}
      MEDALLION_S3_ACCESS_KEY: ${MEDALLION_S3_ACCESS_KEY:-climate-worker}
      MEDALLION_S3_SECRET_KEY: ${MEDALLION_S3_SECRET_KEY:?Set MEDALLION_S3_SECRET_KEY}
    volumes:
      - ./scripts/ops/minio-init.sh:/init/minio-init.sh:ro
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
  dagster-code:
    build:
      context: .
      dockerfile: Dockerfile.medallion-worker
    image: ${CLIMATE_MEDALLION_WORKER_IMAGE:-climate-platform-medallion-worker:latest}
    pull_policy: ${MEDALLION_WORKER_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      minio-init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    environment: *medallion-environment
    volumes:
      - registry:/storage/metadata
      - medallion-cache:/worker-cache
      - dagster-home:/dagster-home
    command:
      - dagster
      - code-server
      - start
      - -h
      - 0.0.0.0
      - -p
      - "4000"
      - -f
      - /app/src/climate_platform/orchestration/definitions.py
    expose:
      - "4000"
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.medallion-worker
    image: ${CLIMATE_MEDALLION_WORKER_IMAGE:-climate-platform-medallion-worker:latest}
    pull_policy: ${MEDALLION_WORKER_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      dagster-code:
        condition: service_started
    environment:
      DAGSTER_HOME: /dagster-home
    volumes:
      - dagster-home:/dagster-home
      - ./deploy/dagster/dagster.yaml:/dagster-home/dagster.yaml:ro
      - ./deploy/dagster/workspace.yaml:/dagster-home/workspace.yaml:ro
    ports:
      - "127.0.0.1:${DAGSTER_PORT:-3000}:3000"
    command:
      - dagster-webserver
      - -h
      - 0.0.0.0
      - -p
      - "3000"
      - -w
      - /dagster-home/workspace.yaml
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 100
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.medallion-worker
    image: ${CLIMATE_MEDALLION_WORKER_IMAGE:-climate-platform-medallion-worker:latest}
    pull_policy: ${MEDALLION_WORKER_PULL_POLICY:-build}
    restart: unless-stopped
    depends_on:
      dagster-code:
        condition: service_started
      api:
        condition: service_healthy
    environment: *medallion-environment
    volumes:
      - registry:/storage/metadata
      - medallion-cache:/worker-cache
      - dagster-home:/dagster-home
      - ./deploy/dagster/dagster.yaml:/dagster-home/dagster.yaml:ro
      - ./deploy/dagster/workspace.yaml:/dagster-home/workspace.yaml:ro
    command:
      - dagster-daemon
      - run
      - -w
      - /dagster-home/workspace.yaml
    cpus: 2.0
    mem_limit: 4g
    pids_limit: 200
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  bronze:
  registry:
  minio-data:
  medallion-cache:
  dagster-home:
